name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos en conflicto
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto exclusivo de frontend
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo se empaqueta y publica el contenido dentro de la carpeta frontend/
          # La carpeta backend/ y sus archivos nunca se despliegan ni se exponen públicamente
          path: 'frontend'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
