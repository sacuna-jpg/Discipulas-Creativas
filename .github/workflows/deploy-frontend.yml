name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

# Permisos requeridos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos en conflicto
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    # Se ejecuta en push a main, disparo manual, o cuando un PR hacia main es cerrado/aprobado con merge
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto exclusivamente de la carpeta frontend
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo se empaqueta y publica el contenido de frontend/
          path: './frontend'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
